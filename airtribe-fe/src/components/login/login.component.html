<div class="login-form">
    <h2>Login</h2>
    <form (ngSubmit)="login()" [formGroup]="loginForm">
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" required formControlName="email">
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" required formControlName="password">
        </div>
        <button type="submit" class="buttonbutton">Login</button>
    </form>
</div>
<div class="success-message" *ngIf="loginSuccess">
  ✓ Login Successful
</div>
